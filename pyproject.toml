[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sched"
version = "0.1.0"
description = "Local-first LLM task scheduler running on Ollama with web search."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "ollama>=0.3",
    "croniter>=2.0",
    "ddgs>=9.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[project.scripts]
sched = "schedlm.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
schedlm = ["web/static/*"]
