# Training requests for `noskill eval simulate`: what a user of each family asks day to day. The
# held-out tasks in ../tasks/multi.yaml have the same families with other names and contents.
# Same format as eval tasks; the check stands in for the user's good/bad rating.
- id: w-sort-1
  family: sort-by-type
  skills: [files]
  writes: true
  prompt: "Tidy up {dir}: put every .txt file into a folder named notes and every .csv file into a folder named sheets."
  files: { todo.txt: t, call.txt: c, budget.csv: "x,y", scores.csv: "1,2", logo.svg: l }
  tools: [move, move_many]
  check: { answered: true }
  end: { exists: [notes/todo.txt, notes/call.txt, sheets/budget.csv, sheets/scores.csv, logo.svg], absent: [todo.txt, budget.csv] }
- id: w-sort-2
  family: sort-by-type
  skills: [files]
  writes: true
  prompt: "Tidy up {dir}: put every .pdf file into a folder named papers and every .png file into a folder named images."
  files: { thesis.pdf: t, invoice.pdf: i, chart.png: c, icon.png: o, song.mp3: s }
  tools: [move, move_many]
  check: { answered: true }
  end: { exists: [papers/thesis.pdf, papers/invoice.pdf, images/chart.png, images/icon.png, song.mp3], absent: [thesis.pdf, icon.png] }
- id: w-sort-3
  family: sort-by-type
  skills: [files]
  writes: true
  prompt: "Tidy up {dir}: put every .log file into a folder named logs and every .txt file into a folder named text."
  files: { a.log: a, b.log: b, c.log: c, read.txt: r, data.bin: d }
  tools: [move, move_many]
  check: { answered: true }
  end: { exists: [logs/a.log, logs/b.log, logs/c.log, text/read.txt, data.bin], absent: [a.log, read.txt] }
- id: w-log-1
  family: log-errors
  skills: [files]
  writes: true
  prompt: "Read {dir}/app.log, write every line that contains ERROR to {dir}/errors.txt, and tell me how many there were. End with just the number."
  files: { app.log: "INFO boot\nERROR no config\nINFO ready\nERROR port in use\n" }
  tools: [write_text]
  check: { number: 2 }
  end: { file_has: { errors.txt: port in use }, file_lacks: { errors.txt: ready } }
- id: w-log-2
  family: log-errors
  skills: [files]
  writes: true
  prompt: "Read {dir}/backup.log, write every line that contains ERROR to {dir}/errors.txt, and tell me how many there were. End with just the number."
  files: { backup.log: "ERROR disk 2 missing\nINFO copied 40 files\nERROR checksum mismatch\nERROR retry failed\nINFO done\n" }
  tools: [write_text]
  check: { number: 3 }
  end: { file_has: { errors.txt: checksum mismatch }, file_lacks: { errors.txt: copied 40 } }
- id: w-log-3
  family: log-errors
  skills: [files]
  writes: true
  prompt: "Read {dir}/sync.log, write every line that contains ERROR to {dir}/errors.txt, and tell me how many there were. End with just the number."
  files: { sync.log: "INFO 1\nINFO 2\nERROR conflict in notes.md\nINFO 3\n" }
  tools: [write_text]
  check: { number: 1 }
  end: { file_has: { errors.txt: conflict in notes.md }, file_lacks: { errors.txt: INFO } }
