- id: w-bak-1
  family: backup-copy
  skills: [files]
  writes: true
  prompt: "Copy every .txt file in {dir} into a folder {dir}/backup, keeping the originals where they are."
  files: { list.txt: "milk eggs", poem.txt: "roses are red", song.mp3: s }
  tools: [copy_verify]
  check: { answered: true }
  end: { exists: [list.txt, poem.txt, song.mp3], absent: [backup/song.mp3], file_has: { backup/list.txt: milk eggs, backup/poem.txt: roses are red } }
- id: w-bak-2
  family: backup-copy
  skills: [files]
  writes: true
  prompt: "Copy every .csv file in {dir} into a folder {dir}/backup, keeping the originals where they are."
  files: { q1.csv: "1,2", q2.csv: "3,4", q3.csv: "5,6", chart.png: c }
  tools: [copy_verify]
  check: { answered: true }
  end: { exists: [q1.csv, q2.csv, q3.csv], absent: [backup/chart.png], file_has: { backup/q1.csv: "1,2", backup/q3.csv: "5,6" } }
- id: w-bak-3
  family: backup-copy
  skills: [files]
  writes: true
  prompt: "Copy every .json file in {dir} into a folder {dir}/backup, keeping the originals where they are."
  files: { users.json: '{"n":1}', roles.json: '{"r":2}', app.log: l }
